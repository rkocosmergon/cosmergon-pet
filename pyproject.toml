[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmergon-pet"
version = "0.6.0"
description = "Physical AI pet for Cosmergon agents — Raspberry Pi + OLED + rotary encoder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RKO Consult UG (haftungsbeschraenkt)", email = "contact@cosmergon.de" },
]
keywords = ["raspberry-pi", "oled", "ai-agent", "cosmergon", "maker", "pet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "cosmergon-agent>=0.18.0",
    "luma.oled>=3.13.0",
    "rpi-lgpio>=0.6",
    "pillow>=10.0.0",
]

[project.scripts]
cosmergon-pet = "cosmergon_pet.face:main"

[project.urls]
Homepage = "https://github.com/rkocosmergon/cosmergon-pet"
Issues = "https://github.com/rkocosmergon/cosmergon-pet/issues"
Documentation = "https://github.com/rkocosmergon/cosmergon-pet#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "RUF"]
# RUF001/002/003 flag × – and similar "ambiguous Unicode" characters in
# strings/docstrings/comments. Legitimate typography in this project
# (German text, schematic labels like "128×64"), not confusable-lookalike
# attacks.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Generator scripts have long literals (PDF tables, SVG strings) —
# readable as-is, wrapping would hurt clarity.
"scripts/generate-pet-guide.py" = ["E501"]
"scripts/generate-wiring-svg.py" = ["E501"]
"scripts/generate-social-preview.py" = ["E501"]
# Vendored from cosmergon-decider-tree — keep identical to upstream so
# `diff` against the source-of-truth stays trivial. Upstream has its own
# ruff config that allows these patterns.
"src/cosmergon_pet/decider_tree.py" = ["N806", "E501"]
