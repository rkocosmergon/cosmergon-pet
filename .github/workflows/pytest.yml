name: Pytest

# S298: die Suite lief bis dahin NIRGENDS automatisch — ein roter Waechter
# (test_valid_actions_set_unchanged) stand deshalb seit v0.3.0 unbemerkt rot
# (S297-Befund). Dieser Workflow schliesst die Luecke.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bewusst OHNE die Pi-Hardware-Deps (luma.oled, rpi-lgpio): die
      # Hardware-Tests skippen sich ohne Display selbst — gleicher Lauf wie
      # lokal auf iMac/Laptop. `pip install -e .` wuerde auf ubuntu-latest an
      # den GPIO-Paketen haengen, ohne einen Test mehr zu fahren.
      - name: Install test deps
        run: pip install "cosmergon-agent>=0.12.0" "pillow>=10.0.0" pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
