name: Pytest

# S298: die Suite lief bis dahin NIRGENDS automatisch — ein roter Waechter
# (test_valid_actions_set_unchanged) stand deshalb seit v0.3.0 unbemerkt rot
# (S297-Befund). Dieser Workflow schliesst die Luecke.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bewusst OHNE die Pi-Hardware-Deps (luma.oled, rpi-lgpio): die
      # Hardware-Tests skippen sich ohne Display selbst — gleicher Lauf wie
      # lokal auf iMac/Laptop. `pip install -e .` wuerde auf ubuntu-latest an
      # den GPIO-Paketen haengen, ohne einen Test mehr zu fahren.
      # Die SDK-Untergrenze hier MUSS zu der in pyproject.toml passen. Sie stand
      # auf >=0.12.0, waehrend das Paket >=0.19.0 verlangt — die Tests liefen
      # also gegen eine Version, die das Paket gar nicht unterstuetzt, und ein
      # gruener Lauf sagte weniger, als er zu sagen schien.
      - name: Install test deps
        run: pip install "cosmergon-agent>=0.19.0" "pillow>=10.0.0" pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # cosmergon#354 (S347): the Pet ships to other people's devices but had no
      # recurring dependency audit (the SDK has one in its CI). Audits the DECLARED
      # runtime deps from pyproject.toml — including the Pi hardware packages the test
      # step above deliberately skips. pip>=26.1: see cosmergon-agent ci.yml (CVE-2026-3219).
      - name: Dependency audit
        run: |
          pip install --upgrade "pip>=26.1" pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/pet-deps.txt
          cat /tmp/pet-deps.txt
          pip-audit -r /tmp/pet-deps.txt
