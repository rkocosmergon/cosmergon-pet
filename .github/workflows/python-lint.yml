name: Python lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.5.0"

      - name: Ruff check
        run: ruff check src/ scripts/ --output-format=github

      - name: Ruff format check
        run: ruff format --check src/ scripts/
